[package]
name = "ulala"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
# Bump `rev` to ship a newer sim. For local development against a sibling checkout, put in .cargo/config.toml:
#   [patch."https://github.com/kachi-dev/uma-race-simulator"]
#   uma_race_sim = { path = "../uma-race-simulator" }
uma_race_sim = { git = "https://github.com/kachi-dev/uma-race-simulator", rev = "4df369b34c2064cae54d26fb0f30f4f02ce5b9f4" }
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree via dioxus-desktop; used for async sleep while polling worker threads.
tokio = { version = "1", features = ["time"] }
# Already in the tree via dioxus-desktop; the native folder picker for the game folder.
rfd = { version = "0.17", default-features = false }

[profile.dev]
opt-level = 1
[profile.dev.package.uma_race_sim]
opt-level = 3

# Whole-program optimization: the sim runs ~10% faster. No panic = "abort": batch jobs report worker panics.
[profile.release]
lto = "fat"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
# Same version dioxus-desktop already pulls in; only for the frameless window chrome (src/chrome_win.rs).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
